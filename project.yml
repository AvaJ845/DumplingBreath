name: DumplingBreath

options:
  bundleIdPrefix: com.avaresearch
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ALWAYS_SEARCH_USER_PATHS: NO

# The pure breath-math lives in Core/ as a Swift package so `swift test` runs it
# instantly and, later, the watchOS target can share it verbatim. It is compiled
# here as an in-project framework to keep XcodeGen's local-package wiring simple.
# Agent 3 owns promoting this to a proper multi-platform shared target.
targets:
  DumplingBreathCore:
    type: framework
    platform: iOS
    sources:
      - path: Core/Sources/DumplingBreathCore
    settings:
      base:
        PRODUCT_NAME: DumplingBreathCore
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.dumplingbreath.core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  DumplingBreath:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources
    dependencies:
      - target: DumplingBreathCore
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dumpling Breath
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: []
    settings:
      base:
        PRODUCT_NAME: DumplingBreath
        PRODUCT_BUNDLE_IDENTIFIER: com.avaresearch.dumplingbreath
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleDefault
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Breath-math tests run via `cd Core && swift test` (fast, no simulator).
  # Agent 1 owns adding a host-app UI/interaction test target when it's warranted.
